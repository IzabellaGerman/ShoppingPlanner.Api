name: CI

on:
  push:
    branches: [ main, feature/** ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore src/ShoppingPlanner.Api/ShoppingPlanner.Api.csproj

      - name: Build
        run: dotnet build src/ShoppingPlanner.Api/ShoppingPlanner.Api.csproj --no-restore -c Release

      - name: Test
        run: dotnet test --no-restore -c Release

      - name: Docker build
        run: docker build -t shopping-planner-api .