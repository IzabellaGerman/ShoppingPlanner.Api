services:
  db:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: devpassword
      POSTGRES_DB: shoppingplanner
      POSTGRES_USER: postgres
    ports:
      - "5433:5432"

  api:
    build: .
    ports:
      - "8080:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Host=db;Port=5432;Database=shoppingplanner;Username=postgres;Password=devpassword
      # Local-only default. Override with JWT_KEY in your shell or a .env file.
      - Jwt__Key=${JWT_KEY:-local-compose-only-key-change-me-0123456789}
    depends_on:
      - db